<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet our rescue — Piper’s Pals Pet Rescue</title>
  <meta name="description" content="Meet one of our rescue dogs at Piper’s Pals Pet Rescue in Key Biscayne, Florida, looking for a forever home." />
  <meta name="theme-color" content="#213C52" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Piper’s Pals Pet Rescue" />
  <meta property="og:title" content="Meet our rescue — Piper’s Pals Pet Rescue" />
  <meta property="og:description" content="A rescue dog in Key Biscayne, Florida looking for a loving forever home." />
  <meta property="og:image" content="https://piperspalspetrescue.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="colors_and_type.css?v=8" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a href="index.html" class="wordmark">Piper’s Pals Pet Rescue</a>
      <div class="wordmark-divider"></div>
      <nav>
        <a href="index.html#dogs" data-i18n="nav.adopt">Adopt</a>
        <a href="index.html#adopt" data-i18n="nav.how">How it works</a>
        <span class="lang-toggle">
          <button data-lang="en">EN</button>
          <button data-lang="es">ES</button>
        </span>
      </nav>
    </div>
  </header>

  <main class="wrap profile" id="profile">
    <p class="loading">Loading…</p>
  </main>

  <footer class="site">
    <div class="wrap">
      <div class="rule"><span>Piper’s Pals Pet Rescue</span></div>
      <span data-i18n="footer.tagline">Helping rescues find forever homes.</span>
      <p class="contact-line"><i class="ph-light ph-map-pin"></i> <span data-i18n="footer.location">Located in Key Biscayne, Florida</span></p>
      <p class="contact-line" id="footerContact"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=8"></script>
  <script src="i18n.js?v=8"></script>
  <script>
    let currentDog = null;
    function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
    function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,"$1<em>$2</em>"); }
    function metaLine(d){
      const sex = d.sex && d.sex!=="unknown" ? t("sex."+d.sex) : null;
      const size = d.size && d.size!=="unknown" ? t("size."+d.size) : null;
      return [d.breed, d.age, sex, size].filter(Boolean).join(" · ");
    }

    function renderDog(){
      const d = currentDog;
      const wrap = document.getElementById("profile");
      if (!d) { wrap.innerHTML = notFound(); return; }
      const photos = (d.photo_urls && d.photo_urls.length) ? d.photo_urls : [];
      const hero = photos[0] || "";
      const contact = d.contact_email
        ? `mailto:${esc(d.contact_email)}?subject=${encodeURIComponent("Adopting " + d.name)}`
        : (d.contact_phone ? `tel:${esc(d.contact_phone)}` : `mailto:${DEFAULT_CONTACT_EMAIL}?subject=${encodeURIComponent("Adopting " + d.name)}`);

      wrap.innerHTML = `
        <a class="back" href="index.html#dogs"><i class="ph-light ph-arrow-left"></i> ${t("profile.back")}</a>
        <div class="profile-grid">
          <div>
            <div class="profile-photo" style="background-image:url('${esc(hero)}')">
              <span class="badge ${d.status}">${t("badge."+d.status)}</span>
            </div>
            ${photos.length > 1 ? `<div class="profile-thumbs">${photos.map((p,i)=>
              `<div class="pthumb${i===0?' active':''}" data-src="${esc(p)}" style="background-image:url('${esc(p)}')"></div>`).join("")}</div>` : ""}
          </div>
          <div class="profile-info">
            <span class="mvc-eyebrow">${t("profile.eyebrow")}</span>
            <h1>${esc(d.name)}</h1>
            <div class="profile-meta">${esc(metaLine(d)) || t("profile.rescue")}</div>
            <p class="profile-desc">${d.description ? fmt(d.description) : t("profile.nodesc")}</p>
            ${/french|frenchie|bulldog/i.test(d.breed || "") ? `<div class="requirement"><i class="ph-light ph-warning-circle"></i> <span>${t("adopt.frenchie")}</span></div>` : ""}
            ${d.status !== "adopted"
              ? `<div class="cta-row">
                   <a class="btn accent" href="apply.html?dog=${encodeURIComponent(d.name)}">${t("profile.apply", { name: esc(d.name) })}</a>
                   <a class="btn secondary" href="${contact}">${t("profile.ask", { name: esc(d.name) })}</a>
                 </div>
                 <p class="pdf-note">${t("cta.pdfpre")} <a href="adoption-application.pdf" download>${t("cta.pdflink")}</a> ${t("cta.pdfpost")}</p>`
              : `<div class="adopted-note">${t("profile.adopted", { name: esc(d.name) })}</div>`}
          </div>
        </div>`;

      // thumbnail switching
      wrap.querySelectorAll(".pthumb").forEach(th => th.addEventListener("click", () => {
        wrap.querySelector(".profile-photo").style.backgroundImage = `url('${th.dataset.src}')`;
        wrap.querySelectorAll(".pthumb").forEach(x => x.classList.remove("active"));
        th.classList.add("active");
      }));
    }

    function notFound(){
      return `<div class="empty">${t("profile.notfound")} <a href="index.html#dogs">${t("profile.notfoundlink")}</a></div>`;
    }

    async function load(){
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { renderDog(); return; }
      const { data: d, error } = await sb.from("dogs").select("*").eq("id", id).single();
      currentDog = (error || !d) ? null : d;
      if (currentDog) document.title = `${currentDog.name} — Piper’s Pals Pet Rescue`;
      renderDog();
    }

    document.querySelector(".lang-toggle").addEventListener("click", e => {
      const btn = e.target.closest("button"); if (!btn) return;
      setLang(btn.dataset.lang, renderDog);
    });

    function renderContact() {
      const el = document.getElementById("footerContact");
      if (el) el.innerHTML = `<a href="mailto:${DEFAULT_CONTACT_EMAIL}">${DEFAULT_CONTACT_EMAIL}</a>`;
    }

    applyStaticI18n();
    renderContact();
    load();
  </script>
</body>
</html>
